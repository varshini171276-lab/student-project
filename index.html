<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; display:flex; justify-content:center; padding:40px; }
        .card { background:white; padding:24px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.08); width:420px; }
        input { width:100%; padding:10px; margin:8px 0 14px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
        button { width:100%; padding:12px; border:none; border-radius:8px; background:#2563eb; color:white; font-size:16px; }
        .result { margin-top:16px; padding:12px; background:#ecfdf5; border:1px solid #10b981; border-radius:8px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Student Performance Predictor</h2>
    <form method="post">
        <label>Study Hours</label>
        <input type="number" step="0.1" name="study_hours" required>

        <label>Attendance (%)</label>
        <input type="number" step="0.1" name="attendance" required>

        <label>Sleep Hours</label>
        <input type="number" step="0.1" name="sleep_hours" required>

        <label>Previous Marks</label>
        <input type="number" step="0.1" name="previous_marks" required>

        <button type="submit">Predict Performance</button>
    </form>

    {% if prediction %}
    <div class="result"><strong>{{ prediction }}</strong></div>
    {% endif %}
</div>
</body>
</html>
